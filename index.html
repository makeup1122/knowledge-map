<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>知识地图</title>
  <link rel="stylesheet" href="lf/leaflet.css" />
  <style>
    :root{--bg:#0f1419;--panel:#1a2332;--border:#2d3a4d;--text:#e7ecf3;--muted:#9aa8bc;--accent:#3d8bfd;--danger:#e35d6a;--card:#152033;--warn:#e6b84d}
    *{box-sizing:border-box}html,body{height:100%;margin:0;font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    #filters{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;max-height:96px;overflow:auto}
    .chip{font-size:11px;padding:4px 8px;border-radius:999px;border:1px solid var(--border);background:#243044;color:var(--muted);cursor:pointer;user-select:none}
    .chip.on{border-color:var(--accent);color:#fff;background:#1e3a5f}
    #routes-box{padding:8px 12px;border-bottom:1px solid var(--border)}
    #routes-box h2{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
    .route-row{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0;color:var(--text)}
    .leaflet-control-layers input{width:auto;margin:0 6px 0 0}.leaflet-control-layers label{display:flex;align-items:center;margin:2px 0;color:#333;font-size:12px}.route-row input{width:auto;flex:0 0 auto;margin:0}.swatch{width:14px;height:3px;border-radius:2px;flex:0 0 auto}
    #toolbar{padding:8px 12px;border-bottom:1px solid var(--border);display:flex;gap:6px;flex-wrap:wrap}
    button{appearance:none;border:1px solid var(--border);background:#243044;color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;cursor:pointer}
    button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
    button.danger{background:transparent;border-color:var(--danger);color:var(--danger)}
    #point-list{flex:1;overflow:auto;padding:8px}
    .point-card{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;background:var(--card)}
    .point-card:hover{border-color:var(--accent)}
    .point-card h3{margin:0 0 4px;font-size:14px}
    .point-card .meta{font-size:12px;color:var(--muted);line-height:1.4}
    .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--border);color:var(--muted);margin-left:4px}
    .badge.dest{border-color:#5ac8a8;color:#5ac8a8}
    .badge.warn{border-color:var(--warn);color:var(--warn)}
    .empty{color:var(--muted);font-size:13px;padding:16px 8px;text-align:center;line-height:1.6}
    #map-wrap{position:relative;min-height:0}#map{height:100%;width:100%;background:#0b1016}
    .hint{position:absolute;z-index:1000;left:50%;top:12px;transform:translateX(-50%);background:rgba(26,35,50,.92);border:1px solid var(--border);padding:8px 12px;border-radius:999px;font-size:13px;display:none}
    .hint.show{display:block}
    #modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:4000;align-items:center;justify-content:center;padding:16px}
    #modal-backdrop.show{display:flex}
    #modal{width:min(460px,100%);background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px;max-height:92vh;overflow:auto}
    #modal h2{margin:0 0 12px;font-size:16px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
    input,textarea{width:100%;background:#0f1724;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font-size:14px;font-family:inherit}
    textarea{min-height:64px;resize:vertical}textarea.tall{min-height:100px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
    .popup-actions{margin-top:8px}
    #app{display:grid;grid-template-columns:360px 1fr;height:100%;transition:grid-template-columns .2s}#app.collapsed{grid-template-columns:0 1fr}#app.collapsed #sidebar{overflow:hidden;border:none}
    #toggle-side{position:absolute;z-index:1100;left:10px;top:80px;background:#1a2332;color:#e7ecf3;border:1px solid #2d3a4d;border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer}
    #sidebar{background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;z-index:2;position:relative}
    #sidebar header{padding:14px 14px 10px}
    #sidebar header h1{margin:0;font-size:18px}
    #sheet-handle{display:none}
    #ctrl-bar{display:flex;gap:6px;padding:0 14px 10px;border-bottom:1px solid var(--border);position:relative}
    #ctrl-bar button{padding:5px 10px}
    #ctrl-bar button.on{border-color:var(--accent);color:#fff}
    .count{display:inline-block;min-width:16px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:10px;line-height:16px;text-align:center}
    .count:empty{display:none}
    #manage-menu{display:none;position:absolute;top:34px;left:72px;z-index:20;background:#1f2a3c;border:1px solid var(--border);border-radius:10px;padding:4px;min-width:140px;box-shadow:0 8px 20px rgba(0,0,0,.4)}
    #manage-menu.show{display:block}
    #manage-menu button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:8px 10px}
    #manage-menu button:hover{background:#243044}
    .proj-legend{background:rgba(20,26,36,.92);color:#dfe6f0;border:1px solid #2c3a4f;border-radius:8px;padding:6px 9px;font-size:12px;max-width:240px;line-height:1.5}
    .proj-legend .lg-h{font-weight:600;cursor:pointer;user-select:none}
    .proj-legend.min .lg-b{display:none}
    .proj-legend .lg-row{display:flex;align-items:center;gap:6px}
    .proj-legend .lg-line{display:inline-block;width:26px;height:0;border-top:4px solid}
    .proj-legend .lg-cav{color:#9aa8bc;margin-top:4px;font-size:11px}
    .proj-pop .lab{display:inline-block;font-size:10px;padding:0 5px;border:1px solid #e6b84d;color:#b8860b;border-radius:999px;margin-left:4px}
    #filter-area{display:none;border-bottom:1px solid var(--border);max-height:40%;overflow:auto}
    #filter-area.show{display:block}
    #filters{border:none;max-height:none;padding:10px 14px 4px;display:flex;flex-wrap:wrap;gap:6px}
    #routes-box{border:none;padding:6px 14px 10px}
    #list-view,#detail-view{flex:1;display:flex;flex-direction:column;min-height:0}
    #detail-view{display:none}
    #sidebar.detail #list-view{display:none}#sidebar.detail #detail-view{display:flex}
    #list-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;color:var(--muted)}
    .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
    .seg span{padding:3px 8px;cursor:pointer}.seg span.on{background:#1e3a5f;color:#fff}
    #point-list{flex:1;overflow:auto;padding:0 10px 10px}
    .region-h{display:flex;align-items:center;gap:6px;padding:8px 4px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;color:var(--text)}
    .region-h .arrow{color:var(--muted);width:12px;transition:transform .15s}
    .region.closed .arrow{transform:rotate(-90deg)}.region.closed .region-body{display:none}
    .region-h .n{color:var(--muted);font-weight:400;font-size:12px}
    #detail-view header{padding:10px 14px;border-bottom:1px solid var(--border)}
    #d-back{margin-bottom:8px}
    #detail-view h2{margin:0 0 4px;font-size:18px;line-height:1.3}
    #d-era{font-size:13px;color:var(--muted)}
    #detail-body{flex:1;overflow:auto;padding:14px}
    #detail-body section{margin-bottom:16px}
    #detail-body h3{margin:0 0 8px;font-size:13px;color:var(--accent);font-weight:600}
    #detail-body p{font-size:14px;line-height:1.7;margin:0 0 8px;white-space:pre-wrap}
    #detail-photos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    #detail-photos img{width:100%;border-radius:8px;border:1px solid var(--border);object-fit:cover;max-height:140px}
    #detail-actions{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px}
    @media(max-width:800px){
      #app,#app.collapsed{display:block;position:relative}
      #map-wrap{position:absolute;inset:0}
      #toggle-side{display:none}
      #sidebar,#app.collapsed #sidebar{position:absolute;left:0;right:0;bottom:0;height:30%;z-index:1500;border:1px solid var(--border);border-bottom:none;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.4);transition:height .2s;overflow:hidden}
      #sidebar.expanded{height:75%}
      #sheet-handle{display:block;padding:8px 0 2px;cursor:pointer;flex:0 0 auto}
      #sheet-handle::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#4a5a72;margin:0 auto}
      #sidebar header{padding:6px 14px 8px}
      #sidebar header h1{display:none}
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="sheet-handle" title="展开 / 收起"></div>
      <header>
        <h1>知识地图</h1>
        <input id="search" type="search" placeholder="搜索标题 / 年代 / 简述…" />
      </header>
      <div id="ctrl-bar">
        <button id="btn-filter" type="button">筛选<span id="filter-count" class="count"></span></button>
        <button id="btn-manage" type="button">管理 ▾</button>
        <div id="manage-menu">
          <button id="btn-add" type="button">加点</button>
          <button id="btn-export" type="button">导出 JSON</button>
          <button id="btn-import" type="button">导入 JSON</button>
          <button id="btn-reset" type="button">恢复种子</button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </div>
      <div id="filter-area">
        <div id="filters"></div>
        <div id="routes-box"><h2>示意路线（可开关）</h2><div id="routes"></div></div>
        <div id="projects-box" style="padding:6px 14px 10px"><h2 style="margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600">工程线路</h2><div id="projects"></div></div>
      </div>
      <div id="list-view">
        <div id="list-head"><span id="list-info"></span><span class="seg" id="scope-seg"><span data-v="view">只看当前视野</span><span data-v="all">全部</span></span></div>
        <div id="point-list"></div>
      </div>
      <div id="detail-view">
        <header><button id="d-back" type="button">← 返回</button><h2 id="d-title"></h2><div id="d-era"></div></header>
        <div id="detail-body"></div>
        <div id="detail-actions"><button id="d-edit" type="button">编辑</button><button id="d-focus" class="primary" type="button">在地图定位</button></div>
      </div>
    </aside>
    <div id="map-wrap">
      <button id="toggle-side" type="button">隐藏面板</button>
      <div id="hint" class="hint">点击地图放置知识点</div>
      <div id="map"></div>
    </div>
  </div>

  <div id="modal-backdrop"><div id="modal">
    <h2 id="modal-title">添加知识点</h2>
    <label>标题</label><input id="f-title" maxlength="80" />
    <label>年代</label><input id="f-era" maxlength="80" />
    <label>主题标签（逗号分隔）</label><input id="f-tags" placeholder="明长城, 走西口" />
    <label>简述</label><textarea id="f-desc"></textarea>
    <label>详情正文</label><textarea id="f-detail" class="tall"></textarea>
    <label>地理 / 怎么走</label><textarea id="f-geo"></textarea>
    <label>出行提示</label><textarea id="f-visit"></textarea>
    <label>出处 / 来源</label><input id="f-source" />
    <label><input id="f-verified" type="checkbox" style="width:auto;margin-right:6px" />已核实</label>
    <label>照片 URL（每行一个）</label><textarea id="f-photos"></textarea>
    <label>分区（留空则按内置分区）</label><input id="f-region" placeholder="晋北 / 晋中 / …" />
    <div class="row"><div><label>lat</label><input id="f-lat" type="number" step="any" /></div><div><label>lng</label><input id="f-lng" type="number" step="any" /></div></div>
    <div class="modal-actions">
      <button id="btn-delete" class="danger" type="button" style="margin-right:auto;display:none">删除</button>
      <button id="btn-cancel" type="button">取消</button>
      <button id="btn-save" class="primary" type="button">保存</button>
    </div>
  </div></div>

  <script src="lf/leaflet.js"></script>
  <script>
    const STORAGE_KEY = "knowledge-map-points-v3";
    const ROUTE_KEY = "knowledge-map-routes-v3";
    const SEED_POINTS = [{"id": "sx_01", "title": "晋阳（太原）", "era": "春秋至宋 · 赵国初都 / 唐北都 / 北宋平晋阳", "desc": "山西政治中心的长线：赵简子筑晋阳，其后为唐王朝北都；979年宋灭北汉后火灌晋阳，新城太原逐步兴起。读山西政治史往往从这里起笔。", "lat": 37.729629, "lng": 112.493567, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "sx_02", "title": "平城（大同）", "era": "北魏 · 398–494 年首都", "desc": "拓跋珪迁都于此，北魏前期政治与佛教中心；云冈石窟即这一时期国家工程。后迁洛阳，平城仍是北方军事重镇。", "lat": 40.092319, "lng": 113.295266, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "sx_03", "title": "雁门关", "era": "战国至明清 · 长城要塞", "desc": "勾注山脉隘口，中原与草原往来的锁钥。白登之战后汉匈和亲、唐与突厥、宋辽对峙，多次战役与和议都绕不开此关。", "lat": 39.179352, "lng": 112.875901, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["明长城", "晋北防线"]}, {"id": "sx_04", "title": "娘子关", "era": "唐至明清 · 晋冀咽喉", "desc": "太行山晋冀通道上的关城，传说与平阳公主驻兵有关。近代正太铁路经此，是山西东出华北平原的要冲。", "lat": 37.960136, "lng": 113.868813, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["明长城", "晋北防线"]}, {"id": "sx_05", "title": "平遥古城", "era": "明清 · 晋商金融中心", "desc": "保存完整的明清县城格局；日升昌等票号在此兴起，山西商人把汇兑网络铺向全国。看晋商与内地金融史的第一站。", "lat": 37.15472, "lng": 112.143419, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "sx_06", "title": "运城盐池（解池）", "era": "先秦至今 · 河东盐业", "desc": "河东盐自先秦即为国家财源，解州盐池催生运城聚落与盐务制度。理解山西南部经济与王朝财政，盐池是关键节点。", "lat": 35.01383, "lng": 110.997276, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线", "明长城", "晋北防线"]}, {"id": "sx_07", "title": "五台山", "era": "北朝以降 · 文殊道场", "desc": "中国佛教四大名山之一，北魏起寺院林立，唐宋皇家屡有兴建。宗教、朝贡与边疆文化交汇，不只是风景名胜。", "lat": 38.953713, "lng": 113.633135, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "sx_08", "title": "侯马（新田）", "era": "春秋 · 晋国晚期都城", "desc": "晋景公迁都新田后，晋国在此维持百余年；侯马盟书等考古材料，是读春秋宗法与盟誓制度的一手现场。", "lat": 35.619121, "lng": 111.365762, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "sx_09", "title": "壶口瀑布（黄河）", "era": "古今 · 晋陕峡谷节点", "desc": "黄河切穿晋陕峡谷最窄处之一，航运与渡口史、黄河治理叙事常提到此处。地理险要本身即历史舞台。", "lat": 36.148703, "lng": 110.44392, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "sx_10", "title": "上党（长治一带）", "era": "战国至近代 · 太行屋脊", "desc": "「与天为党」的高地走廊，长平之战就在附近；历代视上党为控扼河东与中原的军事锁钥。", "lat": 36.187171, "lng": 113.100345, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史整理 · 山西起点", "verified": true, "tags": ["山西长线"]}, {"id": "bt_01", "title": "右卫古城（右玉旧城）", "era": "赵—明清 · 善无 / 大同右卫", "desc": "今右玉右卫镇。汉雁门郡治善无在此一带；明洪武置大同右卫，永乐七年（1409）并入玉林卫，称右玉林卫。嘉靖三十七年（1558）正月俺答围右卫，守将尚表坚守约四个月，杨博督援后解围。隆庆和议后为杀虎口互市后方、走西口起点之一。清为朔平府、右玉县治，1972年县城迁梁家油坊（今新城镇）。", "lat": 40.161328, "lng": 112.344444, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（已修正）", "verified": true, "tags": ["明长城", "晋北防线", "走西口"], "sources": [{"title": "明史纪事本末·卷六十·俺答封贡", "url": "https://www.zhonghuashu.com/wiki/%E6%98%8E%E5%8F%B2%E7%B4%80%E4%BA%8B%E6%9C%AC%E6%9C%AB/%E5%8D%B760"}, {"title": "右玉县 建制沿革（中文百科，弱二手）", "url": "https://www.newton.com.tw/wiki/%E5%8F%B3%E7%8E%89/864998"}], "verify_notes": "原文“围城八月”与《明史纪事本末》“拒守四阅月”不符，已改；“赵武灵王善无”无可靠出处，删去。善无为雁门郡治属通说，未逐条查正史原文。"}, {"id": "bt_02", "title": "杀虎口", "era": "明—清 · 晋蒙关口 / 互市与走西口", "desc": "右玉北，苍头河出晋入内蒙古处。明称杀胡口，长城关口；隆庆五年（1571）和议后设马市互市；清初改称杀虎口，为走西口要冲，通凉城、土默川。", "lat": 40.246417, "lng": 112.306312, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（核对一致）", "verified": true, "tags": ["明长城", "晋北防线", "走西口"], "sources": [{"title": "李孝聪：历史上的杀虎口（北大人文社科院）", "url": "http://www.ihss.pku.edu.cn/ t": 39.635134, "lng": 111.44536, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（核对一致）", "verified": true, "tags": ["明长城", "晋北防线"], "sources": [{"title": "长城黄河“握手”处（新华网山西）", "url": "http://www.sx.xinhuanet.com/20240913/8db43ea3a1474d82bfe2c765ea8c1f2c/c.html"}], "verify_notes": "“俺答西线沿墙北侧东趋丫角山”属推断，未核。"}, {"id": "bt_07", "title": "利民堡（利民镇）", "era": "明成化以降 · 内边中路", "desc": "老营以东、阳方口以西的内长城堡。旧名达沐河，成化十七年（1481）巡抚秦纮筑土堡，嘉靖十八年设守备，二十七年（1548）改设参将，万历四年砌石城。堡北边墙有歇头场口。今属朔州市朔城区利民镇，镇政府在利民堡村；内长城过堡后东南入神池县，明代与神池、八角、三岔合称「四城堡」。堡东沿长城有口里、口外歇头场两村，当地传为古战场「血头场」谐音，属地名传说，史书未载具体战事。", "lat": 39.3008, "lng": 112.103, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（已修正）", "verified": true, "tags": ["明长城", "晋北防线"], "sources": [{"title": "乾隆宁武府志（识典古籍）", "url": "https://www.shidianguji.com/book/HY4400/chapter/1ksii9x7fbyuf"}, {"title": "宁武府志·卷四（识典古籍）", "url": "https://www.shidianguji.com/book/NLG312001067709/chapter/1la6zxfur52qr"}, {"title": "朔城区人民政府·利民镇概况", "url": "http://www.szscq.gov.cn/zwgk/zwgkml/xxxgkml/lmz_16380/gknr25/ggfwly_18109/202407/t20240712_682342.html"}], "verify_notes": "原文“嘉靖二十七年歇头场等战”未找到战事记载，二十七年实为改设参将，已改。今属朔州还是神池请地理确认。宁武府志条目为搜索摘要，建议人工复看原文。"}, {"id": "bt_08", "title": "宁武关 / 阳方口", "era": "明 · 外三关之中 / 恢河谷道", "desc": "外三关之中。恢河出管涔山北麓，经阳方口入朔州平原，为桑干河上游；阳方口为宁武关前沿隘口，号“水旱关”。", "lat": 39.105992, "lng": 112.33012, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（核对一致）", "verified": true, "tags": ["明长城", "晋北防线"], "sources": [{"title": "畅读忻州：“关山”不远（新华网）", "url": "https://app.xinhuanet.com/news/article.html?articleId=91fa3fa7-edba-4def-a7dc-1fd0d198db68"}, {"title": "外三关（百度百科，弱）", "url": "https://baike.baidu.com/item/%E5%A4%96%E4%B8%89%E5%85%B3/2869010"}]}, {"id": "bt_09", "title": "峙峪遗址", "era": "旧石器晚期 · 约距今2.8万年", "desc": "朔州峙峪村黑驼山下，1963年发现，贾兰坡主持发掘。出土细小石器、石镞（弓箭证据）、装饰品及大量马、野驴等动物骨骼。旧碳十四约2.8万年，2024年中科院古脊椎所等新测年定为距今约4.5万年。第八批全国重点文物保护单位（2019）。", "lat": 39.398466, "lng": 112.35284, "detail": "", "geo_notes": 9194.html"}, {"title": "绥远城为清代所建（中新网）", "url": "https://www.chinanews.com.cn/cul/2014/11-19/6791217.shtml"}], "verify_notes": "原文“康熙建绥远城”错，实为乾隆初。"}, {"id": "bt_13", "title": "河口古镇（托克托）", "era": "清 · 走西口黄河码头", "desc": "托克托黄河渡口古镇，位于黄河上、中游分界处，清代水运繁盛，号“塞外小汉口”；存同治元年（1862）铸铁蟠龙旗杆一对。走西口商贸节点。", "lat": 40.247465, "lng": 111.165946, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（核对一致）", "verified": true, "tags": ["走西口"], "sources": [{"title": "托克托古河口（澎湃·政务）", "url": "https://www.thepaper.cn/newsDetail_forward_12553910"}, {"title": "内蒙古区情网·文物古迹", "url": "https://www.nmgqq.com.cn/quqinggailan/neimengguyinxiang/wenwuguji/2019-4-18/12490.html"}], "verify_notes": "“玄龙铁旗杆”通称铸铁蟠龙旗杆。"}, {"id": "bt_14", "title": "昭君博物院（青冢）", "era": "西汉竟宁元年（前33）相关纪念地", "desc": "呼和浩特南郊玉泉区、大黑河南岸，昭君墓（青冢）所在，第六批全国重点文物保护单位（2006）。昭君出塞在西汉竟宁元年（前33）。", "lat": 40.707241, "lng": 111.676642, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（核对一致）", "verified": true, "tags": ["史前与北疆", "土默川"], "sources": [{"title": "全国重点文物保护单位王昭君墓（呼和浩特市昭君文化研究会）", "url": "http://zhaojunwenhua.net/fwly/info/963.html"}, {"title": "昭君博物院（呼和浩特博物院）", "url": "http://www.hhhtbwg.cn/hbgk_96"}], "verify_notes": "包头昭君岛等为后起地名一说未核，已略去。"}, {"id": "bt_15", "title": "凉城 / 岱海", "era": "史前—北魏以降 · 土默川东南门户", "desc": "乌兰察布凉城，蛮汉山南麓，南接右玉。岱海周边有老虎山等距今约5000年的新石器遗址群。北魏与后燕参合陂之战（395）旧说在岱海一带，近年考证多认为参合陂即黄旗海，地望有争议。走西口走廊。", "lat": 40.569, "lng": 112.687193, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（已修正）", "verified": true, "tags": ["史前与北疆", "土默川", "明长城", "晋北防线", "走西口"], "sources": [{"title": "岱海遗址群见证史前文化互鉴融通（新华网内蒙古）", "url": "http://nmg.news.cn/2022-04/22/c_1128584633.htm"}, {"title": "燕魏参合陂之战地望新考", "url": "http://zhaojunwenhua.net/wx/info/1041.html"}], "verify_notes": "原文把参合陂直接定在岱海，已改为“有争议”。"}, {"id": "bt_16", "title": "海生不浪遗址", "era": "新石器 · 距今约5000–6000年", "desc": "托克托县海生不浪村黄河阶地，海生不浪文化命名地，距今约5700–5000年，属仰韶文化中晚期系统，见证草原与中原交流。自治区级重点文物保护单位。", "lat": 40.15, "lng": 111.17, "detail": "", "geo_notes": "", "visit_tips": "", "photos": [], "source": "历史核实（已修正）", "verified": true, "tags": ["史前", "史前与北疆", "土默川"], "sources": [{"title": "托县海生不浪等成为自治区级重点文保单位（内蒙古新闻网）", "url": "http://inews.nmgnews.com.cn/system/2014/10/15/011551528.shtml"}, {"title": "北疆文化·海生不浪文化遗址（澎湃）", "url": "https://m.thepaper.cn/baijiahao_25341929"}], "verify_notes": "年代精确为约5700–5000年；补文保级别。"}, {"id": "dest_chunyanggong", "title": "太原纯阳宫", "era": "宋元以降 · 道教宫观 / 现山西省艺术博物馆", "desc": "太原旧城核心区的道教宫观（吕祖庙），五一广场西北隅；全国重点文保，现为山西省艺术博物馆。城市一日游里很顺的「二级详情」点。", "lat": 37.86139, "lng": 112.56583, "detail": "纯阳宫（俗称吕祖庙）在太原迎泽区起凤街1号，五一广场西北角，是太原现存规模较大的道教宫观建筑群，主祀吕洞宾（道号纯阳子）。宫址坐北朝南，多进院落沿中轴展开，布局紧凑又带园林趣味：牌坊—道德之门—吕祖殿—九窑十八洞（八卦院）—玉皇阁/巍阁一线，洞、亭、楼交错，和单纯「大殿排开」的北方官式道观很不一样。\n\n地理上它落在太原盆地城区、汾河以东的旧城商贸核心，地势平缓；和西南晋源的晋阳古城遗址、西北崛围山等「山地/古城」点不在同一片，适合当作市区步行圈的一站，而不是和晋阳半日游硬绑在同一上午。\n\n今天院内同时是山西省艺术博物馆，参观时可并行两条线：宫观空间与道教布局；近现代文保再利用与展览。沿革细目仍以 @历史 核实为准。", "geo_notes": "坐标约 37.8614°N, 112.5658°E（五一广场西北）。太原盆地冲积平原、城区建成区；西侧不远即汾河河谷，但宫观本身不临河。旧城街巷密、停车难，地铁/公交到五一广场步行最省事。与晋阳古城（晋源，约南偏西 15–20 km 量级）需单独交通时段。", "visit_tips": "出发前：查山西省艺术博物馆当日开放与是否临展预约。\n现场：先沿中轴走完五进，再回头看九窑十八洞的八卦平面；适合拍牌坊、琉璃与窑洞回廊。\n串联（同城）：崇善寺、文庙、柳巷/钟楼街步行圈；不要和晋阳古城、天龙山挤进同一上午。\n注意：文保建筑勿攀爬；展厅依馆方规定拍照。", "photos": [], "source": "", "verified": true, "tags": ["出行预读", "太原市区", "山西长线"]}, {"id": "dest_xiaolangdi", "title": "小浪底水利枢纽", "era": "当代 · 黄河中游关键控制性工程（1994–2001）", "desc": "黄河中游末段峡谷出口的大型水利枢纽：防洪、防凌、减淤为主，兼顾供水、灌溉、发电。出行前先弄清「黄河在这里要解决什么」。", "lat": 34.924636, "lng": 112.377297, "detail": "小浪底坝址在河南洛阳孟津（南岸小浪底村）与济源（北岸蓼坞村）之间的黄河干流上，洛阳城区以北约 40 km，三门峡下游约 130 km。这里是黄河中游最后一段峡谷的出口——再往下，河道进入华北平原，泥沙容易落淤，形成地上河。因此它是三门峡以下唯一能取得较大库容的控制性工程，控制流域面积约 69.4 万 km²（约占黄河流域的 92%）。\n\n去之前建议先建立三层认识：\n1）问题：中游多沙 + 下游地上河；伏秋大汛与凌汛威胁并存。\n2）工程：斜心墙堆石坝（坝高约 154 m、坝顶长约 1667 m）；总库容约 126.5 亿 m³，其中淤沙库容约 75.5 亿 m³、长期有效库容约 51 亿 m³；开发任务以防洪、防凌、减淤为主，兼顾供水、灌溉、发电，运用上强调蓄清排浑与调水调沙。\n3）体系：与三门峡、陆浑、故县及东平湖等联合调度，可将下游防洪标准提高到约千年一遇量级（具体调度以官方当年方案为准）。\n\n库区呈东西带状峡谷型水库（常说长约百余公里量级），两岸为崤山—邙山与王屋山等山地丘陵；水位随防洪与调水调沙变化，观景水面相对位置会变。参观叙事通常是「问题—大坝—库区—调度效果」；展览馆适合先建立框架，再上坝区/观景台对照真实峡谷与坝体。", "geo_notes": "坐标约 34.9246°N, 112.3773°E。地貌：黄河中游峡谷末端出口，南岸孟津黄土丘陵、北岸济源王屋山前缘；水库为峡谷河道型。交通：常见经洛阳或济源进景区，山区盘山路多，汛期/调水调沙期可能管制。观景点与库水位相对高差会变，拍照选位宜先看当日水位说明。", "visit_tips": "出发前：查景区开放、观光车与大坝参观是否预约；关注黄河水利相关资讯中的调水调沙或泄洪安排（可能临时关闭局部区域）。\n看什么：①展览馆建立「泥沙—防洪—减淤」框架；②观景台看坝体尺度与峡谷约束；③若开放，再看泄洪建筑物外观（勿进入禁区）。\n安全：严格按景区指示，远离禁入的坝肩、泄洪与施工区；雨天注意湿滑与山路。\n串联：洛阳市区文物半日 + 小浪底半日较常见；不要指望「顺便看完三门峡大坝」同一天轻松往返。", "photos": [], "source": "", "verified": true, "tags": ["出行预读", "黄河治理"]}, {"id": "sx_11", "title": "头马营（引黄南干线出水口）", "era": "北宋营寨 · 2003 年引黄南干线出水口", "region": "晋北", "desc": "宁武县宁化镇头马营村，紧邻汾河上游。万家寨引黄工程南干线 7 号隧洞（神池小狗儿涧至头马营，约 42.5 km）在这里出洞，黄河水由此汇入汾河，顺汾河河道南下到汾河水库，再接联接段送往太原。等于把黄河水翻过管涔山分水岭，倒进山西的母亲河。村子本身是北宋军马营寨旧址。", "lat": 38.728083, "lng": 112.117731, "sources": [{"title": "万家寨引黄工程介绍（南干线至宁武县头马营）", "url": "http://spot.cnair.com/shanxi/linfen/linfen12.htm"}, {"title": "南干线 7# 隧洞：神池县小狗儿涧至宁武县头马营", "url": "https://www.fanpusoft.com/project/gl/477590.html"}, {"title": "山西新闻网：宁武县头马营村（2003 年引黄南线出水口竣工）", "url": "https://sn.sxrb.com/content/202608/05/c221300.html"}], "verified": true, "source": "地理整理（OSM 村点 + 3 条出处）", "tags": ["黄河治理", "出行预读"], "detail": "", "geo_notes": "", "visit_tips": "", "photos": []}];
    const SEED_ROUTES = [{"id": "route_waisanguan", "title": "外三关西线（偏头—宁武—雁门）", "tags": ["明长城", "晋北防线"], "note": "明山西镇外三关：偏头关—宁武/阳方口—雁门关。示意连线，非精确墙体走向。", "point_ids": ["bt_03", "bt_04", "bt_08", "sx_03"]}, {"id": "route_anda_west", "title": "俺答西线示意（老牛湾→丫角→老营）", "tags": ["明长城", "晋北防线"], "note": "对话更正后：墙北清水河南境黄土梁为骑兵走廊；与县川河无关。示意点序。", "point_ids": ["bt_06", "bt_05", "bt_04", "bt_03"]}, {"id": "route_zouxikou", "title": "走西口东线示意（杀虎口→土默川）", "tags": ["走西口", "土默川"], "note": "杀虎口互市/走西口东线通向凉城、归化（呼和浩特）一带。示意连线。", "point_ids": ["bt_01", "bt_02", "bt_15", "bt_12"]}, {"id": "route_shoujiang", "title": "三受降城示意", "tags": ["土默川"], "note": "唐代三受降城东西呼应，位置说法有争议，点位为约位示意。", "point_ids": ["bt_10", "bt_11"]}];
    const SEED_PROJECTS = [{"id": "yinhuang", "title": "万家寨引黄工程", "route": "引黄工程（万家寨引黄入晋）", "crs": "WGS-84", "intro": "万家寨引黄入晋工程从晋蒙交界的黄河万家寨水利枢纽取水，经总干线、南干线、联接段和北干线向太原、朔州、大同供水，线路总长约450公里，设计年引水12亿立方米，五级泵站总扬程636米，隧洞约占线路的46%。1993年2月国家计委批准可研，同年5月22日奠基，1997年9月1日主体工程全面开工；工程利用世界银行贷款（协定额4亿美元，实际使用约3.25亿美元）并国际招标，国内首次大规模使用全断面隧道掘进机（TBM），由意大利CMC等国际承包商施工。一期（总干线、南干线、联接段）2003年10月26日起向太原供水，二期北干线2009年2月27日开工、2011年9月16日正式通水。", "intro_sources": [{"title": "央广网：引黄工程 惠泽三晋（2024）", "url": "https://www.cnr.cn/sx/yw/20241223/t20241223_527017844.shtml"}, {"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}, {"title": "中国与国际复兴开发银行贷款协定（万家寨引水项目）", "url": "http://www.fsou.net/html/text/eag/1006642/100664282_1.html"}, {"title": "回顾发改系统推进“山西引黄入晋”纪实", "url": "https://www.ppdoc.com/periodical/02041073d352ca8f1e4ba58603c356c9.html"}, {"title": "新华网（2001-04-18）：引黄工程南干线全部贯通", "url": "https://web.archive.org/web/20140416174353/http:/news.h2o-china.com/html/2001/04/2401987556290_1.shtml"}, {"title": "中新网/人民日报（2011-09-17）：北干线正式通水", "url": "https://www.chinanews.com/gn/2011/09-17/3334216.shtml"}], "nodes": [{"id": "yh_wjz", "title": "万家寨水利枢纽（取水口）", "lat": 39.5765, "lng": 111.4381, "kind": "取水", "note": "黄河干流万家寨坝区，库区约 948 m 高程取水；坐标取万家寨村，坝址在其旁", "approx": true, "desc": "黄河万家寨水利枢纽位于晋蒙交界，是引黄入晋的龙头取水工程，兼有供水、发电、防洪、防凌之用。枢纽1994年主体开工，1998年10月1日下闸蓄水，同年11月28日首台机组并网发电。", "sources": [{"title": "澎湃新闻：万家寨水利枢纽", "url": "https://www.thepaper.cn/newsDetail_forward_29093052"}, {"title": "央广网：引黄工程 惠泽三晋（2024）", "url": "https://www.cnr.cn/sx/yw/20241223/t20241223_527017844.shtml"}]}, {"id": "yh_xtz", "title": "下土寨分水闸", "lat": 39.5385, "lng": 111.9174, "kind": "分水", "note": "总干线终点，分南、北两干线（OSM 下土寨村点）", "approx": false, "desc": "下土寨分水闸位于偏关县，是总干线终点，黄河水在此分入南干线（去太原）和北干线（去朔州、大同）。2011年北干线通水时，黄河水即经万家寨、下土寨水闸进入北干线隧洞。", "sources": [{"title": "中国水利网/山西日报（2011-09-19）：北干线正式通水", "url": "https://www.chinawater.com.cn/newscenter/df/sx/201109/t20110919_198875.html"}, {"title": "中新网/人民日报（2011-09-17）：北干线正式通水", "url": "https://www.chinanews.com/gn/2011/09-17/3334216.shtml"}]}, {"id": "yh_xgej", "title": "小狗儿涧（南干 7 号洞进口一带）", "lat": 39.088, "lng": 112.2244, "kind": "隧洞进口", "note": "7 号洞位于小狗儿涧至头马营间，长约 42.5 km；坐标取小狗儿涧村", "approx": true, "desc": "小狗儿涧位于神池县，是南干线7号隧洞的进口一带。7号洞长约42.5公里，用全断面隧道掘进机从进出口两端对打，2001年4月贯通。", "sources": [{"title": "南干线7#隧洞存在的缺陷和处理措施", "url": "https://www.fanpusoft.com/project/gl/477590.html"}, {"title": "新华网（2001-04-18）：引黄工程南干线全部贯通", "url": "https://web.archive.org/web/20140416174353/http:/news.h2o-china.com/html/2001/04/2401987556290_1.shtml"}]}, {"id": "yh_tmy", "title": "头马营（南干线出水口）", "lat": 38.7281, "lng": 112.1177, "kind": "出水口", "note": "7 号洞出口，黄河水汇入汾河；2003 年竣工", "approx": false, "desc": "头马营位于宁武县，是南干线7号隧洞出口，黄河水在此出洞注入汾河上游，翻过分水岭进入汾河流域。2003年10月起经此向太原供水。", "sources": [{"title": "南干线7#隧洞存在的缺陷和处理措施", "url": "https://www.fanpusoft.com/project/gl/477590.html"}, {"title": "央广网：引黄工程 惠泽三晋（2024）", "url": "https://www.cnr.cn/sx/yw/20241223/t20241223_527017844.shtml"}]}, {"id": "yh_ningh", "title": "宁化（汾河沿线）", "lat": 38.6998, "lng": 112.1026, "kind": "河道", "note": "汾河河道输水途经", "approx": true, "desc": "宁化位于宁武县汾河上游，是联接段借汾河河道输水的途经地，黄河水在这一段以天然河道下泄。", "sources": [{"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}]}, {"id": "yh_jingle", "title": "静乐（汾河沿线）", "lat": 38.3547, "lng": 111.9304, "kind": "河道", "note": "汾河河道输水途经", "approx": true, "desc": "静乐位于汾河上游，是联接段河道输水的途经地，黄河水从这里继续沿汾河南下汾河水库。", "sources": [{"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}]}, {"id": "yh_fhsk", "title": "汾河水库", "lat": 38.0907, "lng": 111.878, "kind": "水库", "note": "联接段利用汾河河道输水约 81.2 km 至此", "approx": false, "desc": "汾河水库是引黄河道段的终点，也是一期工程的调节节点，黄河水入库后再经管线送往太原。2003年起，引黄水由此辗转进入太原城市供水。", "sources": [{"title": "央广网：引黄工程 惠泽三晋（2024）", "url": "https://www.cnr.cn/sx/yw/20241223/t20241223_527017844.shtml"}, {"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}]}, {"id": "yh_guj", "title": "古交（联接段管线途经）", "lat": 37.9161, "lng": 112.1185, "kind": "埋管/隧洞", "note": "汾河水库坝下取水后经管线、隧洞东行，路径示意", "approx": true, "desc": "古交一带是联接段汾河水库至太原输水线的途经地，以隧洞和PCCP埋管输水；此处为路径示意点。", "sources": [{"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}]}, {"id": "yh_huyan", "title": "呼延水厂（太原接水口）", "lat": 37.9711, "lng": 112.4525, "kind": "终点", "note": "联接段终点太原呼延村水厂；坐标取呼延村", "approx": true, "desc": "太原接水终点（呼延水厂一带）。一期工程2003年10月26日投入试运行，黄河水由此进入太原城市供水。", "sources": [{"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}, {"title": "央广网：引黄工程 惠泽三晋（2024）", "url": "https://www.cnr.cn/sx/yw/20241223/t20241223_527017844.shtml"}]}, {"id": "yh_dl", "title": "大梁水库", "lat": 39.5365, "lng": 112.2551, "kind": "水库", "note": "北干线 4 座调节水库之一，在 1 号洞途中", "approx": false, "desc": "大梁水库位于北干线1号隧洞沿线，是北干线四座调节水库之一，随北干线2009年开工、2011年通水投入使用。", "sources": [{"title": "中新网/人民日报（2011-09-17）：北干线正式通水", "url": "https://www.chinanews.com/gn/2011/09-17/3334216.shtml"}, {"title": "澎湃新闻：万家寨水利枢纽", "url": "https://www.thepaper.cn/newsDetail_forward_29093052"}]}, {"id": "yh_mas", "title": "1 号洞出口（平鲁马鞍山村西·中沟湾）", "lat": 39.439, "lng": 112.3656, "kind": "隧洞出口", "note": "北干 1 号洞全长约 43.7 km；出口在马鞍山村西中沟湾北岸，坐标取马鞍山", "approx": true, "desc": "北干线1号隧洞出口一带，黄河水在此流出隧洞，进入海河流域的桑干河一侧，再转入埋地管道东行。2011年7月26日1号洞闸门开启，北干线开始试通水。", "sources": [{"title": "大同人才网：黄河之水金秋来（北干线试通水）", "url": "http://www.dtrcw.net/News/newsdetail-1372.html"}, {"title": "澎湃新闻：万家寨水利枢纽", "url": "https://www.thepaper.cn/newsDetail_forward_29093052"}]}, {"id": "yh_gz", "title": "耿庄水库", "lat": 39.3853, "lng": 112.463, "kind": "水库", "note": "调节水库；坐标取朔城区耿庄，约位", "approx": true, "desc": "北干线沿线调节水库之一，用于调蓄引黄来水，随北干线2011年通水。", "sources": [{"title": "中新网/人民日报（2011-09-17）：北干线正式通水", "url": "https://www.chinanews.com/gn/2011/09-17/3334216.shtml"}]}, {"id": "yh_jst", "title": "金沙滩水库", "lat": 39.6605, "lng": 112.8484, "kind": "水库", "note": "调节水库；坐标取怀仁金沙滩镇，约位", "approx": true, "desc": "北干线沿线调节水库之一，位于怀仁一带，调蓄引黄来水，随北干线2011年通水。", "sources": [{"title": "中新网/人民日报（2011-09-17）：北干线正式通水", "url": "https://www.chinanews.com/gn/2011/09-17/3334216.shtml"}]}, {"id": "yh_qkb", "title": "墙框堡水库（北干线终点）", "lat": 39.9616, "lng": 113.1735, "kind": "终点", "note": "大同南郊，2011-09-16 在此通水；坐标取墙框堡村", "approx": true, "desc": "墙框堡水库位于大同南郊，是北干线最末端水库。2009年2月27日北干线开工仪式在墙框堡村西举行，2011年9月16日正式通水仪式也在此举行。", "sources": [{"title": "大同人才网：黄河之水金秋来（北干线试通水）", "url": "http://www.dtrcw.net/News/newsdetail-1372.html"}, {"title": "中国水利网/山西日报（2011-09-19）：北干线正式通水", "url": "https://www.chinawater.com.cn/newscenter/df/sx/201109/t20110919_198875.html"}, {"title": "中新网/人民日报（2011-09-17）：北干线正式通水", "url": "https://www.chinanews.com/gn/2011/09-17/3334216.shtml"}]}], "segments": [{"id": "seg_zong", "title": "总干线", "line": "总干线", "nodes": ["yh_wjz", "yh_xtz"], "mode": "泵站提水 + 隧洞", "length_km": 44.4, "schematic": true, "note": "万家寨至下土寨，多级泵站提水（总扬程约 636 m）后入洞东行；具体泵站位置未定位", "desc": "总干线自万家寨水库取水，经多级泵站提水后以隧洞东行至偏关下土寨分水闸，再分为南、北两干线。全线五级泵站总扬程636米。总干线6、7、8号隧洞由意大利CMC-SELI公司用全断面隧道掘进机施工、预制管片衬砌。属一期工程，1997年9月主体开工，2003年随一期向太原供水。", "sources": [{"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_1.html"}, {"title": "引黄总干线水工隧洞工程检测和缺陷处理", "url": "https://www.233.com/jzs2/gcsw/fudao/20080625/093652642.html"}, {"title": "央广网：引黄工程 惠泽三晋（2024）", "url": "https://www.cnr.cn/sx/yw/20241223/t20241223_527017844.shtml"}]}, {"id": "seg_nan_a", "title": "南干线（下土寨—小狗儿涧）", "line": "南干线", "nodes": ["yh_xtz", "yh_xgej"], "mode": "隧洞为主", "schematic": true, "note": "过偏关河、穿管涔山北段", "desc": "南干线自下土寨分水闸向南，以隧洞为主穿越晋西北山地，是一期向太原输水的主线。南干线4至7号洞由国际承包商“万龙联营体”用TBM施工，1997年9月1日开工，2001年4月南干线隧洞全部贯通。", "sources": [{"title": "新华网（2001-04-18）：引黄工程南干线全部贯通", "url": "https://web.archive.org/web/20140416174353/http:/news.h2o-china.com/html/2001/04/2401987556290_1.shtml"}, {"title": "引黄入晋（工程概况、一期组成）", "url": "https://www.jiluxiaokang.com/mgjc/data/detail/20130808/222548_     function saveAll(){localStorage.setItem(STORAGE_KEY,JSON.stringify(points)); localStorage.setItem(ROUTE_KEY,JSON.stringify(routes));}

    function allTags(){
      const s=new Set(); points.forEach(p=>(p.tags||[]).forEach(t=>s.add(t))); return [...s].sort((a,b)=>a.localeCompare(b,"zh"));
    }
    function renderFilters(){
      const tags=allTags();
      el.filters.innerHTML = tags.map(t=>`<span class="chip ${activeTags.has(t)?"on":""}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`).join("") +
        (activeTags.size?`<span class="chip" data-tag="__clear">清除筛选</span>`:"");
      el.filters.querySelectorAll(".chip").forEach(chip=>{
        chip.onclick=()=>{
          const t=chip.dataset.tag;
          if(t==="__clear") activeTags.clear();
          else if(activeTags.has(t)) activeTags.delete(t); else activeTags.add(t);
          renderFilters(); updateFilterCount(); refreshView();
        };
      });
    }
    function renderRouteToggles(){
      el.routes.innerHTML = routes.map((r,i)=>{
        const color=ROUTE_COLORS[i%ROUTE_COLORS.length];
        const on=enabledRoutes.has(r.id);
        return `<label class="route-row"><input type="checkbox" data-id="${r.id}" ${on?"checked":""}/><span class="swatch" style="background:${color}"></span><span>${escapeHtml(r.title)}</span></label>`;
      }).join("") || '<div class="empty" style="padding:4px 0">暂无路线</div>';
      el.routes.querySelectorAll("input").forEach(inp=>{
        inp.onchange=()=>{ if(inp.checked) enabledRoutes.add(inp.dataset.id); else enabledRoutes.delete(inp.dataset.id); updateFilterCount(); renderMarkers(); };
      });
    }

    function visiblePoints(){
      const q=(el.search.value||"").trim().toLowerCase();
      return points.filter(p=>{
        if(activeTags.size){
          const pt=new Set(p.tags||[]);
          for(const t of activeTags){ if(!pt.has(t)) return false; }
        }
        if(!q) return true;
        return (p.title||"").toLowerCase().includes(q)||(p.era||"").toLowerCase().includes(q)||(p.desc||"").toLowerCase().includes(q);
      });
    }

    function popupHtml(p){
      const era=p.era?`<div style="color:#9aa8bc;font-size:12px;margin:2px 0 6px;">${escapeHtml(p.era)}</div>`:"";
      const warn=!p.verified?`<div style="color:#e6b84d;font-size:12px;margin-bottom:4px;">待核实</div>`:"";
      const desc=p.desc?`<div style="white-space:pre-wrap;max-width:240px;">${escapeHtml(p.desc)}</div>`:"";
      return `<strong>${escapeHtml(p.title||"未命名")}</strong>${era}${warn}${desc}<div class="popup-actions"><button type="button" class="leaflet-popup-detail" data-id="${p.id}">查看详情</button></div>`;
    }

    function regionOf(p){ return p.region || REGION_MAP[p.id] || "未分区"; }
    function queryActive(){ return !!(activeTags.size || (el.search.value||"").trim()); }
    function listedPoints(){
      if(queryActive()) return visiblePoints();
      if(ui.scope==="all") return points.slice();
      const b=map.getBounds();
      return points.filter(p=>b.contains([p.lat,p.lng]));
    }
    function updateFilterCount(){ const n=activeTags.size+enabledRoutes.size+enabledProjects.size; el.filterCount.textContent=n?String(n):""; }
    function renderMarkers(){
      markersLayer.clearLayers();
      const q=(el.search.value||"").trim();
      const routeIds=new Set(); routes.forEach(r=>{ if(enabledRoutes.has(r.id)) r.point_ids.forEach(i=>routeIds.add(i)); });
      const vis=new Set();
      if(activeTags.size||q) visiblePoints().forEach(p=>vis.add(p.id));
      routeIds.forEach(i=>vis.add(i));
      if(focusId) vis.add(focusId);
      if(map.getZoom()>=8 && !queryActive()){ const b=map.getBounds(); points.forEach(p=>{ if(b.contains([p.lat,p.lng])) vis.add(p.id); }); }
      points.forEach(p=>{
        if(!vis.has(p.id)) return;
        const m=L.marker([p.lat,p.lng]);
        m.bindPopup(popupHtml(p));
        m.on("popupopen",(e)=>{
          const btn=e.popup.getElement().querySelector(".leaflet-popup-detail");
          if(btn) btn.onclick=(ev)=>{ev.preventDefault(); openDetail(p.id,{keepView:true});};
        });
        m.addTo(markersLayer);
      });
      renderList();
      drawRoutes();
    }
    function drawRoutes(){
      routesLayer.clearLayers();
      const byId=Object.fromEntries(points.map(p=>[p.id,p]));
      routes.forEach((r,i)=>{
        if(!enabledRoutes.has(r.id)) return;
        // if tag filter active, only show route when it intersects filter OR route tags match
        if(activeTags.size){
          const rt=new Set(r.tags||[]);
          const hit=[...activeTags].some(t=>rt.has(t)) || r.point_ids.some(id=> (byId[id]?.tags||[]).some(t=>activeTags.has(t)));
          if(!hit) return;
        }
        const latlngs=[];
        r.point_ids.forEach(id=>{ const p=byId[id]; if(p) latlngs.push([p.lat,p.lng]); });
        if(latlngs.length<2) return;
        const color=ROUTE_COLORS[i%ROUTE_COLORS.length];
        L.polyline(latlngs,{color,weight:3.5,opacity:0.9,dashArray:"8 6"}).bindPopup(`<strong>${escapeHtml(r.title)}</strong><br/><span style="color:#9aa8bc">${escapeHtml(r.note||"示意连线")}</span>`).addTo(routesLayer);
      });
    }
    function cardHtml(p){
      const badges=(hasRich(p)?'<span class="badge dest">有详情</span>':'')+(!p.verified?'<span class="badge warn">待核实</span>':'');
      return `<div class="point-card" data-id="${p.id}"><h3>${escapeHtml(p.title||"未命名")}${badges}</h3><div class="meta">${escapeHtml(p.era||"年代未填")}${(p.tags&&p.tags.length)?" · "+escapeHtml(p.tags.join(" / ")):""}</div></div>`;
    }
    function renderList(){
      const qa=queryActive();
      [...el.scopeSeg.children].forEach(s=>s.classList.toggle("on",s.dataset.v===ui.scope));
      el.scopeSeg.style.opacity=qa?.4:1;
      const list=listedPoints();
      el.listInfo.textContent = qa ? `匹配 ${list.length} 个` : (ui.scope==="view" ? `视野内 ${list.length} 个` : `全部 ${list.length} 个`);
      if(!list.length){
        el.list.innerHTML=`<div class="empty">${qa?"没有匹配的知识点。":"当前视野里没有知识点，拖动或缩小地图试试"}</div>`; return;
      }
      const groups=new Map();
      list.forEach(p=>{ const r=regionOf(p); if(!groups.has(r)) groups.set(r,[]); groups.get(r).push(p); });
      const order=[...REGION_ORDER.filter(r=>groups.has(r)), ...[...groups.keys()].filter(r=>!REGION_ORDER.includes(r)&&r!=="未分区").sort((a,b)=>a.localeCompare(b,"zh")), ...(groups.has("未分区")?["未分区"]:[])];
      el.list.innerHTML=order.map(r=>{
        const ps=groups.get(r).sort((a,b)=>(a.title||"").localeCompare(b.title||"","zh"));
        return `<div class="region ${closedRegions.has(r)?"closed":""}" data-region="${escapeHtml(r)}"><div class="region-h"><span class="arrow">▾</span>${escapeHtml(r)} <span class="n">${ps.length}</span></div><div class="region-body">${ps.map(cardHtml).join("")}</div></div>`;
      }).join("");
      el.list.querySelectorAll(".region-h").forEach(h=>h.onclick=()=>{
        const box=h.parentElement, r=box.dataset.region;
        box.classList.toggle("closed"); if(box.classList.contains("closed")) closedRegions.add(r); else closedRegions.delete(r); saveUi();
      });
      el.list.querySelectorAll(".point-card").forEach(card=>card.addEventListener("click",()=>openDetail(card.dataset.id)));
    }

    function section(title,text){ if(!text) return ""; return `<section><h3>${escapeHtml(title)}</h3><p>${escapeHtml(text)}</p></section>`; }
    const appEl=$("app"), tg=$("toggle-side");
    function setCollapsed(c){ appEl.classList.toggle("collapsed",c); tg.textContent=c?"显示面板":"隐藏面板"; setTimeout(()=>map.invalidateSize(),250); }
    function openDetail(id,opts={}){
      const p=points.find(x=>x.id===id); if(!p) return;
      if(!el.sidebar.classList.contains("detail")) listScroll=el.list.scrollTop;
      detailId=id; if(focusId!==id){ focusId=id; renderMarkers(); }
      el.dTitle.textContent=p.title||"未命名";
      el.dEra.textContent=(p.era||"") + (p.tags&&p.tags.length?(" · "+p.tags.join(" / ")):"") + " · " + regionOf(p);
      const photos=(p.photos&&p.photos.length)?`<section><h3>照片</h3><div id="detail-photos">${p.photos.map(u=>`<img src="${escapeHtml(u)}" alt="" loading="lazy"/>`).join("")}</div></section>`:"";
      const verify = p.verified
        ? section("史料状态", "已核实（或来自整理稿；仍欢迎纠错）")
        : section("史料状态", "待核实" + (p.source?("\n来源："+p.source):"\n来源未注明"));
      const srcHtml=(p.sources&&p.sources.length)?`<section><h3>出处</h3><ul style="margin:0;padding-left:1.2em">${p.sources.map(s=>`<li style="font-size:13px;line-height:1.6"><a href="${escapeHtml(s.url)}" target="_blank" rel="noopener" style="color:#7fb3ff">${escapeHtml(s.title||s.url)}</a></li>`).join("")}</ul>${p.verify_notes?`<p style="font-size:12px;color:#9aa8bc;margin-top:6px">核实说明：${escapeHtml(p.verify_notes)}</p>`:""}</section>`:"";
      el.dBody.innerHTML = verify + srcHtml + section("概述", p.desc||"暂无简述。") + section("详细介绍", p.detail||"二级详情还空着，可点编辑补充。") +
        section("地理 / 怎么走", p.geo_notes) + section("出行提示", p.visit_tips) + photos +
        section("坐标", `${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}`);
      el.dBody.scrollTop=0;
      el.sidebar.classList.add("detail");
      if(appEl.classList.contains("collapsed")) setCollapsed(false);
      if(window.matchMedia("(max-width:800px)").matches) el.sidebar.classList.add("expanded");
      if(!opts.keepView) map.setView([p.lat,p.lng], Math.max(map.getZoom(),9));
    }
    function closeDetail(){
      el.sidebar.classList.remove("detail"); detailId=null;
      if(focusId){ focusId=null; renderMarkers(); } else renderList();
      el.list.scrollTop=listScroll;
    }
    function refreshView(){ renderMarkers(); }

    function setAddMode(on){ addMode=on; el.btnAdd.textContent=on?"取消加点":"加点"; el.hint.classList.toggle("show",on); map.getContainer().style.cursor=on?"crosshair":""; }
    function fillForm(p){
      el.title.value=p.title||""; el.era.value=p.era||""; el.tags.value=(p.tags||[]).join(", ");
      el.desc.value=p.desc||""; el.detailField.value=p.detail||""; el.geo.value=p.geo_notes||""; el.visit.value=p.visit_tips||"";
      el.source.value=p.source||""; el.verified.checked=!!p.verified; el.photos.value=(p.photos||[]).join("\n");
      el.region.value=p.region||""; el.region.placeholder=(p.id&&REGION_MAP[p.id])?("内置："+REGION_MAP[p.id]):"未分区";
      el.lat.value=p.lat; el.lng.value=p.lng;
    }
    function openCreate(ll){ editingId=null; el.modalTitle.textContent="添加知识点"; fillForm({title:"",era:"",tags:[],desc:"",detail:"",geo_notes:"",visit_tips:"",source:"",verified:false,photos:[],lat:ll.lat,lng:ll.lng}); el.lat.value=ll.lat.toFixed(6); el.lng.value=ll.lng.toFixed(6); el.btnDelete.style.display="none"; el.backdrop.classList.add("show"); }
    function openEdit(id){ const p=points.find(x=>x.id===id); if(!p) return; editingId=id; el.modalTitle.textContent="编辑知识点"; fillForm(p); el.btnDelete.style.display="inline-block"; el.backdrop.classList.add("show"); setAddMode(false); }
    function closeModal(){ el.backdrop.classList.remove("show"); editingId=null; }
    function readForm(){
      const lat=Number(el.lat.value), lng=Number(el.lng.value);
      if(!Number.isFinite(lat)||!Number.isFinite(lng)){ alert("请填写有效 lat/lng"); return null; }
      return { title:el.title.value.trim(), era:el.era.value.trim(),
        tags:el.tags.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean),
        desc:el.desc.value.trim(), detail:el.detailField.value.trim(), geo_notes:el.geo.value.trim(), visit_tips:el.visit.value.trim(),
        source:el.source.value.trim(), verified:el.verified.checked, region:el.region.value.trim(),
        photos:el.photos.value.split(/\n+/).map(s=>s.trim()).filter(Boolean), lat, lng };
    }
    el.btnAdd.onclick=()=>{ el.manageMenu.classList.remove("show"); setAddMode(!addMode); };
    el.btnCancel.onclick=closeModal;
    el.backdrop.onclick=(e)=>{ if(e.target===el.backdrop) closeModal(); };
    $("d-back").onclick=closeDetail;
    $("d-edit").onclick=()=>{ if(detailId) openEdit(detailId); };
    $("d-focus").onclick=()=>{ const p=points.find(x=>x.id===detailId); if(!p) return; map.setView([p.lat,p.lng],Math.max(map.getZoom(),12)); if(window.matchMedia("(max-width:800px)").matches) el.sidebar.classList.remove("expanded"); };
    el.search.oninput=refreshView;
    el.btnFilter.onclick=()=>{ const on=el.filterArea.classList.toggle("show"); el.btnFilter.classList.toggle("on",on); };
    el.btnManage.onclick=(e)=>{ e.stopPropagation(); el.manageMenu.classList.toggle("show"); };
    document.addEventListener("click",(e)=>{ if(!el.manageMenu.contains(e.target)&&e.target!==el.btnManage) el.manageMenu.classList.remove("show"); });
    el.manageMenu.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>el.manageMenu.classList.remove("show")));
    el.scopeSeg.querySelectorAll("span").forEach(s=>s.onclick=()=>{ ui.scope=s.dataset.v; saveUi(); renderList(); });
    $("sheet-handle").onclick=()=>{ el.sidebar.classList.toggle("expanded"); };
    el.btnSave.onclick=()=>{
      const data=readForm(); if(!data) return;
      const wasEditing=editingId;
      if(editingId){ const i=points.findIndex(x=>x.id===editingId); if(i>=0) points[i]=normalize({...points[i],...data}); }
      else points.push(normalize({id:uid(),...data}));
      saveAll(); renderFilters(); refreshView(); closeModal(); setAddMode(false);
      openDetail(wasEditing||points[points.length-1].id,{keepView:!!wasEditing});
    };
    el.btnDelete.onclick=()=>{ if(!editingId||!confirm("确定删除？")) return; const id=editingId; points=points.filter(x=>x.id!==id); routes.forEach(r=>{r.point_ids=r.point_ids.filter(x=>x!==id)}); if(focusId===id) focusId=null; saveAll(); renderFilters(); closeModal(); closeDetail(); refreshView(); };
    map.on("click",(e)=>{ if(addMode) openCreate(e.latlng); });
    map.on("moveend",()=>{ renderMarkers(); });
    el.btnExport.onclick=()=>{
      const blob=new Blob([JSON.stringify({points,routes},null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="knowledge-map-v3.json"; a.click(); URL.revokeObjectURL(a.href);
    };
    el.btnImport.onclick=()=>el.importFile.click();
    el.importFile.onchange=async()=>{
      const file=el.importFile.files&&el.importFile.files[0]; el.importFile.value=""; if(!file) return;
      try{
        const raw=JSON.parse(await file.text());
        const incoming=Array.isArray(raw)?raw:raw.points;
        if(Array.isArray(raw?.routes)) routes=raw.routes;
        if(!Array.isArray(incoming)) throw new Error("需要 points 数组，或 {points, routes}");
        const byId=new Map(points.map(p=>[p.id,p]));
        incoming.map(normalize).filter(p=>Number.isFinite(p.lat)&&Number.isFinite(p.lng)).forEach(p=>{
          if(byId.has(p.id)) byId.set(p.id,{...byId.get(p.id),...p}); else byId.set(p.id,p);
        });
        points=[...byId.values()]; enabledRoutes=new Set();
        saveAll(); renderFilters(); renderRouteToggles(); updateFilterCount(); refreshView(); fitAll();
      }catch(err){ alert("导入失败："+err.message); }
    };
    el.btnReset.onclick=()=>{
      if(!confirm("恢复种子点与示意路线？")) return;
      points=SEED_POINTS.map(normalize); routes=JSON.parse(JSON.stringify(SEED_ROUTES));
      enabledRoutes=new Set(); saveAll(); renderFilters(); renderRouteToggles(); updateFilterCount(); refreshView(); fitAll();
    };

    async function refreshWaterways(){
      if(!waterwaysEnabled||waterwaysLoading) return;
      if(map.getZoom()<7){ waterways.clearLayers(); return; }
      const b=map.getBounds();
      const query=`[out:json][timeout:25];(way["waterway"~"river|stream|canal"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}););out geom;`;
      waterwaysLoading=true;
      try{
        const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:query});
        if(!res.ok) throw new Error("Overpass "+res.status);
        const json=await res.json(); waterways.clearLayers();
        (json.elements||[]).forEach(elmt=>{
          if(!elmt.geometry||elmt.geometry.length<2) return;
          L.polyline(elmt.geometry.map(g=>[g.lat,g.lon]),{color:"#2aa6ff",weight:elmt.tags&&elmt.tags.waterway==="river"?2.5:1.5,opacity:0.85}).addTo(waterways);
        });
      }catch(e){console.warn(e)} finally{waterwaysLoading=false}
    }
    function scheduleWaterways(){ if(!waterwaysEnabled) return; clearTimeout(waterwaysTimer); waterwaysTimer=setTimeout(refreshWaterways,600); }
    map.on("overlayadd",e=>{ if(e.layer===waterways){ waterwaysEnabled=true; scheduleWaterways(); }});
    map.on("overlayremove",e=>{ if(e.layer===waterways){ waterwaysEnabled=false; waterways.clearLayers(); }});
    map.on("moveend", scheduleWaterways);
    async function refreshRail(){
      if(!railOn||railLoading) return;
      if(map.getZoom()<8){ rail.clearLayers(); return; }
      const b=map.getBounds();
      const q=`[out:json][timeout:25];way["railway"~"rail|subway|light_rail"](${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()});out geom;`;
      railLoading=true;
      try{
        const res=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:q});
        if(!res.ok) throw new Error("Overpass "+res.status);
        const json=await res.json(); rail.clearLayers();
        (json.elements||[]).forEach(w=>{
          if(!w.geometry||w.geometry.length<2) return;
          const ll=w.geometry.map(g=>[g.lat,g.lon]);
          L.polyline(ll,{color:"#333",weight:3,opacity:0.8}).addTo(rail);
          L.polyline(ll,{color:"#fff",weight:1.5,opacity:0.9,dashArray:"6 6"}).addTo(rail);
        });
      }catch(e){console.warn(e)} finally{railLoading=false}
    }
    function scheduleRail(){ if(!railOn) return; clearTimeout(railTimer); railTimer=setTimeout(refreshRail,700); }
    map.on("overlayadd",e=>{ if(e.layer===rail){ railOn=true; scheduleRail(); }});
    map.on("overlayremove",e=>{ if(e.layer===rail){ railOn=false; rail.clearLayers(); }});
    map.on("moveend", scheduleRail);
    function fitAll(){ const vis=visiblePoints(); if(!vis.length) return; map.fitBounds(L.latLngBounds(vis.map(p=>[p.lat,p.lng])).pad(0.15)); }

    // ---- 工程线路（SEED_PROJECTS）：数据形状 {id,title,nodes,segments,sources,caveat}；节点/分段可选 desc、sources，便于按 id 合并补充文案 ----
    const PROJECT_LINE_COLORS={"总干线":"#e53935","南干线":"#1e88e5","北干线":"#fdd835","联接段":"#00e5c0"};
    const projectsLayer=L.layerGroup().addTo(map);
    let enabledProjects=new Set();
    function mergeProjectText(projId,extra){ const pr=SEED_PROJECTS.find(p=>p.id===projId); if(!pr) return; [...pr.nodes,...pr.segments].forEach(x=>{ const e=extra[x.id]; if(e){ if(e.desc) x.desc=e.desc; if(e.sources) x.sources=e.sources; } }); drawProjects(); }
    function srcLinks(list){ if(!list||!list.length) return ""; return '<div style="margin-top:4px">出处：'+list.map(s=>`<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>`).join("；")+'</div>'; }
    function segPopup(pr,s){
      return `<div class="proj-pop"><strong>${escapeHtml(s.title)}</strong>${s.schematic?'<span class="lab">示意线</span>':''}<br/>`+
        `<span style="color:#9aa8bc">${escapeHtml(pr.title)} · ${escapeHtml(s.line)} · ${escapeHtml(s.mode||"")}${s.length_km!=null?" · 约 "+s.length_km+" km":""}</span>`+
        `<div style="margin-top:4px">${escapeHtml(s.desc||s.note||"")}</div>`+(s.geometry_source?`<div style="color:#9aa8bc;font-size:11px">走向：${escapeHtml(s.geometry_source)}</div>`:"")+
        srcLinks(s.sources&&s.sources.length?s.sources:pr.sources)+`</div>`;
    }
    function nodePopup(pr,n){
      return `<div class="proj-pop"><strong>${escapeHtml(n.title)}</strong>${n.approx?'<span class="lab">约位</span>':''}<br/><span style="color:#9aa8bc">${escapeHtml(pr.title)} · ${escapeHtml(n.kind||"")}</span>`+
        `<div style="margin-top:4px">${escapeHtml(n.desc||n.note||"")}</div>`+(n.approx?'<div style="color:#9aa8bc;font-size:11px">约位：坐标取附近村镇，非精确位置</div>':'')+srcLinks(n.sources)+`</div>`;
    }
    function drawProjects(){
      projectsLayer.clearLayers();
      SEED_PROJECTS.forEach(pr=>{
        if(!enabledProjects.has(pr.id)) return;
        const byId={}; pr.nodes.forEach(n=>byId[n.id]=n);
        pr.segments.forEach(s=>{
          const ll=s.geometry&&s.geometry.length?s.geometry:s.nodes.map(i=>byId[i]).filter(Boolean).map(n=>[n.lat,n.lng]);
          if(ll.length<2) return;
          const color=PROJECT_LINE_COLORS[s.line]||"#ff7a59";
          const dash=s.schematic?"10 7":null;
          L.polyline(ll,{color:"#111",weight:7,opacity:0.6,dashArray:dash,interactive:false}).addTo(projectsLayer);
          L.polyline(ll,{color,weight:4,opacity:0.95,dashArray:dash}).bindPopup(segPopup(pr,s)).addTo(projectsLayer);
        });
        pr.nodes.forEach(n=>{
          L.circleMarker([n.lat,n.lng],{radius:5,color:"#111",weight:n.approx?1.5:2,fillColor:n.approx?"#ffffff":"#ffffff",fillOpacity:n.approx?0.15:0.95,dashArray:n.approx?"2 2":null})
            .bindTooltip(escapeHtml(n.kind||""),{direction:"top",offset:[0,-4],className:""}).bindPopup(nodePopup(pr,n)).addTo(projectsLayer);
        });
      });
      updateLegend();
    }
    const ProjLegend=L.Control.extend({options:{position:"bottomleft"},onAdd(){ const d=L.DomUtil.create("div","proj-legend"); L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d); return d; }});
    const projLegend=new ProjLegend(); let legendOn=false, legendMin=false;
    function updateLegend(){
      const on=enabledProjects.size>0;
      if(on&&!legendOn){ projLegend.addTo(map); legendOn=true; } else if(!on&&legendOn){ projLegend.remove(); legendOn=false; }
      if(!on) return;
      const box=projLegend.getContainer(); box.classList.toggle("min",legendMin);
      const cav=SEED_PROJECTS.filter(p=>enabledProjects.has(p.id)).map(p=>p.caveat).filter(Boolean).join(" ");
      box.innerHTML=`<div class="lg-h">工程线路图例 ${legendMin?"▸":"▾"}</div><div class="lg-b">`+
        Object.entries(PROJECT_LINE_COLORS).map(([k,c])=>`<div class="lg-row"><span class="lg-line" style="border-color:${c}"></span>${k}</div>`).join("")+
        `<div class="lg-row"><span class="lg-line" style="border-color:#ccc"></span>实线 = 河道明流（OSM 实际河线）</div><div class="lg-row"><span class="lg-line" style="border-color:#ccc;border-top-style:dashed"></span>虚线 = 示意 / 地下段</div>`+
        `<div class="lg-row"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;border:1px dashed #ccc"></span>空心虚圈 = 约位节点</div>`+
        SEED_PROJECTS.filter(p=>enabledProjects.has(p.id)&&p.intro).map(p=>`<div class="lg-cav" style="color:#dfe6f0;max-height:110px;overflow:auto;margin:2px 0 4px">${escapeHtml(p.intro)}</div>`).join("")+`<div class="lg-cav">${escapeHtml(cav.length>110?cav.slice(0,108)+"…":cav||"除汾河河道段外均为示意线。")}</div></div>`;
      box.querySelector(".lg-h").onclick=()=>{ legendMin=!legendMin; updateLegend(); };
    }
    function renderProjectToggles(){
      const box=document.getElementById("projects");
      box.innerHTML=SEED_PROJECTS.map(pr=>`<label class="route-row"><input type="checkbox" data-id="${pr.id}" ${enabledProjects.has(pr.id)?"checked":""}/><span class="swatch" style="background:linear-gradient(90deg,#e53935,#1e88e5,#fdd835,#00e5c0)"></span><span>引黄工程（${escapeHtml(pr.title)}）</span></label>`).join("");
      box.querySelectorAll("input").forEach(inp=>{
        inp.onchange=()=>{ const id=inp.dataset.id; if(inp.checked) enabledProjects.add(id); else enabledProjects.delete(id); updateFilterCount(); drawProjects();
          if(inp.checked){ const pr=SEED_PROJECTS.find(p=>p.id===id); const pts=[]; pr.nodes.forEach(n=>pts.push([n.lat,n.lng])); pr.segments.forEach(s=>(s.geometry||[]).forEach(q=>pts.push(q))); if(pts.length) map.fitBounds(L.latLngBounds(pts).pad(0.1)); } };
      });
    }
    renderFilters(); renderRouteToggles(); renderProjectToggles(); updateFilterCount(); map.setView([37.8,112.3],7); refreshView();
    tg.onclick=()=>setCollapsed(!appEl.classList.contains("collapsed"));
  </script>
</body>
</html>
